name: Actualizar calendario Mundial 2026

on:
  schedule:
    - cron: '0 * * * *'  # Cada hora
  workflow_dispatch:       # También se puede ejecutar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar calendario .ics
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python generate_calendar.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/mundial2026.ics
          git diff --staged --quiet || git commit -m "Actualizar calendario $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
